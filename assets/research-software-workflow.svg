<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-labelledby="title desc">
<title id="title">From research questions to reusable research software</title>
<desc id="desc">Four connected stages: understand research data, connect data and semantics, develop research software, then validate and enable reuse. Evidence, decisions and limitations stay traceable throughout.</desc>
